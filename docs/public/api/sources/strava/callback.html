<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在完成授权…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font:17px/1.6 -apple-system,'PingFang SC',sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center}
.card{max-width:420px}
.icon{width:64px;height:64px;border-radius:32px;background:#007aff;margin:0 auto 20px;
display:flex;align-items:center;justify-content:center;font-size:32px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h1{font-size:20px;margin:0 0 8px}
p{color:#8e8e93;margin:0 0 16px;font-size:14px}
.form-wrap{display:none}
</style>
</head>
<body>
<div class="card">
<div class="icon" id="spinner">⏳</div>
<h1 id="title">正在完成授权…</h1>
<p id="msg">正在把授权码转发给服务器，请稍候。</p>
<div class="form-wrap" id="formWrap"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var code   = params.get('code')   || '';
  var state  = params.get('state')  || '';
  var error  = params.get('error')  || '';

  var BACKEND = 'http://150.158.157.101';

  if (error) {
    document.getElementById('spinner').style.animation = 'none';
    document.getElementById('spinner').textContent = '!';
    document.getElementById('spinner').style.background = '#ff3b30';
    document.getElementById('title').textContent = '授权没有完成';
    document.getElementById('msg').textContent = 'Strava 返回：' + error;
    return;
  }
  if (!code) {
    document.getElementById('spinner').style.animation = 'none';
    document.getElementById('spinner').textContent = '!';
    document.getElementById('spinner').style.background = '#ff3b30';
    document.getElementById('title').textContent = '授权没有完成';
    document.getElementById('msg').textContent = '没有拿到授权码，请回 App 重新连接。';
    return;
  }

  var form = document.createElement('form');
  form.method = 'GET';
  form.action = BACKEND + '/api/sources/strava/callback';

  var i1 = document.createElement('input');
  i1.type = 'hidden'; i1.name = 'code';  i1.value = code;
  form.appendChild(i1);

  var i2 = document.createElement('input');
  i2.type = 'hidden'; i2.name = 'state'; i2.value = state;
  form.appendChild(i2);

  document.getElementById('formWrap').appendChild(form);
  form.submit();
})();
</script>
</body>
</html>
